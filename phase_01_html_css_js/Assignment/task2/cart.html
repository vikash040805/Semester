<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        nav {
            background-color: #222;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 17px;
        }

        nav a:hover {
            color: #00bcd4;
        }

        #cart-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .cart-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .cart-card h3 {
            margin-top: 0;
        }

        .cart-card p {
            color: #555;
        }

        .delete-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #dc3545;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #b02a37;
        }

        #empty-message {
            text-align: center;
            margin-top: 50px;
            font-size: 22px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>User Management</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>
        </div>
    </nav>

    <div id="cart-container"></div>

    <script src="cart.js"></script>

</body>
</html>

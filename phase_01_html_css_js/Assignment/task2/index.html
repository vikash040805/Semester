<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }
        nav{
            background-color: #222;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav h2{
            color: white;
            margin: 0;
        }
        nav a{
            color: white;
            margin: 0;
        }
        nav a:hover{
            color: #00bcd4;
        }
        #user-container{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
        }
        .user-card{
            background-color: white;
            padding : 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15)
        }
        .user-card h3{
            margin-top: 0;
        }
        .user-card p{
            color: #555;
        }
        .add-btn{
            width: 100%;
            padding: 10px;
            border: none;
            background-color:#007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .add-btn:hover{
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <nav>
        <h2>User Management</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>
        </div>
    </nav>
    <div id="user-container"></div>
    
</body>
</html>

let userContainer = document.getElementById("user-container");


function displayUsers() {

    userContainer.innerHTML = "";

    users.forEach(function(user) {

        let card = document.createElement("div");

        card.className = "user-card";

        card.innerHTML = `
            <h3>${user.name}</h3>

            <p>
                <strong>Username:</strong>
                ${user.username}
            </p>

            <p>
                <strong>Email:</strong>
                ${user.email}
            </p>

            <button class="add-btn" onclick="addToCart(${user.id})">
                Add to Cart
            </button>
        `;

        userContainer.appendChild(card);
    });
}


function addToCart(userId) {

    let selectedUser = users.find(function(user) {
        return user.id === userId;
    });

    let cart = JSON.parse(localStorage.getItem("cart")) || [];


    let alreadyExists = cart.some(function(user) {
        return user.id === userId;
    });


    if (alreadyExists) {

        alert("User is already in the cart!");

        return;
    }

    cart.push(selectedUser);

    localStorage.setItem("cart", JSON.stringify(cart));


    alert("User added to cart!");
}

displayUsers();
